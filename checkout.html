<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<link rel="stylesheet" href="./CSS/checkout.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</head>
<body>
<div class="checkout-container">

    <h1 class="checkout-title">
        Checkout
    </h1>


    <div class="checkout-content">


        <!-- LEFT SIDE -->

        <div>

            <!-- Order Summary -->

            <div class="checkout-card">

                <h2>
                    🛒 Order Summary
                </h2>

                <div id="orderSummary"></div>

                <hr>

                <h2>
                    Total Amount:
                    ₹<span id="orderTotal">0</span>
                </h2>

            </div>



            <!-- Delivery Address -->

            <div class="checkout-card">

                <h2>
                    📍 Delivery Address
                </h2>


                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter Your Name"
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Your Email"
                >


                <label for="address">
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Enter Your Address"
                >

            </div>

        </div>



        <!-- RIGHT SIDE -->

        <div>

            <div class="checkout-card">

                <h2>
                    💳 Payment Method
                </h2>


                <div class="payment-option">

                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="card"
                            onchange="showPaymentFields()"
                        >

                        Credit Card

                    </label>

                </div>


                <div class="payment-option">

                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="upi"
                            onchange="showPaymentFields()"
                        >

                        UPI

                    </label>

                </div>


                <div class="payment-option">

                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="netbanking"
                            onchange="showPaymentFields()"
                        >

                        NetBanking

                    </label>

                </div>


                <div class="payment-option">

                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="cod"
                            onchange="showPaymentFields()"
                        >

                        Cash on Delivery

                    </label>

                </div>


                <!-- Dynamic payment fields -->

                <div id="paymentFields"></div>


                <br>


                <button
                    class="checkout-button"
                    onclick="proceedToPayment()"
                >

                    Proceed to Payment 💳

                </button>

            </div>

        </div>


    </div>

</div>



<script src="checkout.js"></script>

</body>

</html>
